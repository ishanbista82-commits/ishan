<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can I Be Your Boyfriend? ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
}

h1{
    color:white;
    font-size:3rem;
    margin-bottom:30px;
}

.buttons{
    position:relative;
    height:200px;
}

button{
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

#yesBtn{
    background:hsl(180, 79%, 52%);
    color:rgb(211, 14, 14);
    font-size:24px;
    padding:15px 40px;
}

#noBtn{
    background:#dc3545;
    color:white;
    font-size:24px;
    padding:15px 40px;
    position:absolute;
    left:60%;
    top:0;
}

#message{
    margin-top:30px;
    font-size:24px;
    color:white;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

    <h1>Simran Can I Be Your Boyfriend? ❤️</h1>

    <div class="buttons">
        <button id="yesBtn">YES ❤️</button>
        <button id="noBtn">NO 😢</button>
    </div>

    <div id="message"></div>

</div>

<script>

let noClicks = 0;

const reasons = [
    "🥺 Please give me a chance!",
    "❤️ I promise I'll always care about you.",
    "😊 I will try my best to make you smile.",
    "🌹 i have done many mistake but i will improve that all.",
    "💖 Are you really sure?",
    "🥹 Just one chance, please!",
    "😍 I think we'd be great together!"
];

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const message = document.getElementById("message");

noBtn.addEventListener("click", () => {

    noClicks++;

    message.innerHTML =
        reasons[Math.min(noClicks - 1, reasons.length - 1)];

    // Grow YES button
    let currentSize = parseInt(
        window.getComputedStyle(yesBtn).fontSize
    );

    yesBtn.style.fontSize = (currentSize + 8) + "px";
    yesBtn.style.padding =
        (15 + noClicks * 3) + "px " +
        (40 + noClicks * 5) + "px";

    // Shrink NO button
    noBtn.style.transform =
        `scale(${Math.max(0.2,1 - noClicks * 0.15)})`;

    // Move NO button
    const maxX = window.innerWidth - 150;
    const maxY = window.innerHeight - 100;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";

});

yesBtn.addEventListener("click", () => {

    document.body.innerHTML = `
        <div style="
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ff758c,#ff7eb3);
            color:white;
            text-align:center;
        ">
            <h1 style="font-size:70px;">🎉 YAY! 🎉</h1>
            <h2 style="font-size:40px;">
                You said YES! ❤️
            </h2>
            <p style="font-size:28px;margin-top:20px;">
                You just made me the happiest person alive! 🥰
            </p>
        </div>
    `;

});

</script>

</body>
</html>
